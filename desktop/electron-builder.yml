appId: com.nyami.desktop
productName: NYAMI
executableName: NYAMI
icon: icon.ico
directories:
  output: ../release/desktop
  buildResources: ../resource
files:
  - out/**
  - '!**/*.map'
  - '!**/*.log'
  - '!**/test-credentials/**'
  - '!**/__tests__/**'
  - '!**/tests/**'
extraResources:
  - from: ../resource/silence_10s.wav
    to: resource/silence_10s.wav
asar: true
asarUnpack:
  - '**/*.node'
npmRebuild: false
buildDependenciesFromSource: false
artifactName: NYAMI-${version}-${arch}.${ext}
electronVersion: 45.3.3
electronDist: ../node_modules/electron/dist
win:
  # 保留图标和版本资源编辑，未配置证书时只跳过代码签名。
  signAndEditExecutable: true
  signExecutable: true
  verifyUpdateCodeSignature: true
  signtoolOptions:
    publisherName: Nyami Project
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
fileAssociations:
  - ext: nyami
    name: Nyami Playlist
    description: Nyami playlist and queue file
nsis:
  artifactName: NYAMI-Setup-${arch}.${ext}
  oneClick: false
  # assisted installer 默认选择当前用户，避免普通安装不必要地请求管理员权限。
  perMachine: false
  selectPerMachineByDefault: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  differentialPackage: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: NYAMI
  language: 2052
  installerLanguages: zh_CN
  runAfterFinish: true
  shortcutName: NYAMI
