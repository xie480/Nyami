name: 发布 Nyami Windows 桌面端

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop release
        run: npm run desktop:package

      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          $expectedTag = "desktop-v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Git tag $env:GITHUB_REF_NAME does not match desktop version $expectedTag"
          }
          $assetNames = @(
            'NYAMI-Setup-x64.exe',
            'latest.json',
            'SHA256SUMS.txt'
          )
          $assets = @($assetNames | ForEach-Object {
            $path = Join-Path 'release/desktop' $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release asset: $path"
            }
            (Resolve-Path -LiteralPath $path).Path
          })
          if ($assets.Count -ne $assetNames.Count) {
            throw 'Release directory does not contain exactly the expected NYAMI Setup assets'
          }
          gh release create $env:GITHUB_REF_NAME $assets `
            --title "NYAMI PC $($package.version)" `
            --generate-notes
